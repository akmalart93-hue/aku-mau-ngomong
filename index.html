<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ada yang Ingin Aku Bilang... &#128140;</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet" />
  <style>
    .emoji-row span, .deco-divider .icon, .float-emoji,
    .celebrate-emoji-row, #btnYes, #btnNo, #line0, #taunt,
    .redirect-label, .celebrate-title {
      font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f0f7ff;
      font-family: 'Quicksand', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 18% 18%, #d6eaff 0%, transparent 55%),
        radial-gradient(ellipse at 82% 82%, #c9f0e8 0%, transparent 55%),
        radial-gradient(ellipse at 58% 6%,  #dce8ff 0%, transparent 45%),
        #f4f9ff;
      animation: bgPulse 9s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes bgPulse {
      0%   { filter: hue-rotate(0deg)  brightness(1);    }
      100% { filter: hue-rotate(18deg) brightness(1.04); }
    }

    /* ---- floating romantic emojis ---- */
    .float-emoji {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      user-select: none;
      animation: floatDrift linear infinite;
      opacity: 0;
    }
    @keyframes floatDrift {
      0%   { transform: translateY(0) rotate(0deg) scale(1);              opacity: 0;         }
      8%   { opacity: var(--op); }
      88%  { opacity: var(--op); }
      100% { transform: translateY(-108vh) rotate(var(--rot)) scale(0.5); opacity: 0;         }
    }

    /* ---- bubbles ---- */
    .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bubble {
      position: absolute;
      bottom: -80px;
      border-radius: 50%;
      opacity: 0.14;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    /* ---- card ---- */
    .card {
      position: relative;
      z-index: 2;
      background: transparent;
      
      -webkit-
      
      
      padding: 52px 48px 44px;
      max-width: 560px;
      width: 90vw;
      text-align: center;
      animation: cardIn 0.9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(44px) scale(.94); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    .emoji-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 1.75rem;
    }
    .emoji-row span { display: inline-block; animation: floatBob 2.2s ease-in-out infinite; }
    .emoji-row span:nth-child(2) { animation-delay: .25s; }
    .emoji-row span:nth-child(3) { animation-delay: .50s; }
    .emoji-row span:nth-child(4) { animation-delay: .75s; }
    .emoji-row span:nth-child(5) { animation-delay: 1.00s; }
    @keyframes floatBob {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }

    .subtitle {
      font-size: .76rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #7eb8e8;
      font-weight: 600;
      margin-bottom: 22px;
    }

    #typewriter-wrap {
      min-height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .tw-line {
      font-size: 1.06rem;
      font-weight: 600;
      color: #3a5a7c;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .4s, transform .4s;
    }
    .tw-line.visible { opacity: 1; transform: translateY(0); }
    .tw-line.big {
      font-family: 'Dancing Script', cursive;
      font-size: 1.85rem;
      color: #2d7fc1;
    }
    .cursor {
      display: inline-block;
      width: 2px; height: 1.1em;
      background: #5aaee8;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink .7s step-end infinite;
      border-radius: 1px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .deco-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin: 0 auto 26px;
      opacity: 0;
      transform: scaleX(.4);
      transition: opacity .6s .2s, transform .6s .2s;
    }
    .deco-divider.show { opacity: 1; transform: scaleX(1); }
    .deco-divider .line {
      height: 2px; width: 50px;
      border-radius: 99px;
    }
    .deco-divider .line:first-child { background: linear-gradient(90deg, transparent, #74c0fc); }
    .deco-divider .line:last-child  { background: linear-gradient(90deg, #63e6be, transparent); }
    .deco-divider .icon { font-size: 1.1rem; }

    /* ---- buttons ---- */
    .btn-area {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .5s, transform .5s;
    }
    .btn-area.show { opacity: 1; transform: translateY(0); }

    .btn {
      padding: 14px 34px;
      border: none;
      border-radius: 50px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background .2s;
    }
    .btn:hover::after { background: rgba(255,255,255,0.16); }

    .btn-yes {
      background: linear-gradient(135deg, #4dabf7, #38d9a9);
      color: #fff;
      box-shadow: 0 4px 18px rgba(77,171,247,.38);
    }
    .btn-yes:hover  { transform: scale(1.07); box-shadow: 0 6px 26px rgba(77,171,247,.5); }
    .btn-yes:active { transform: scale(.97); }

    .btn-no {
      background: rgba(255,255,255,0.65);
      color: #7da3c4;
      border: 2px solid #b8d8f2;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    /* ---- flee counter badge ---- */
    #flee-badge {
      position: fixed;
      top: 18px; right: 18px;
      z-index: 60;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(10px);
      border: 1.5px solid #b8d8f2;
      border-radius: 50px;
      padding: 7px 16px;
      font-size: .78rem;
      font-weight: 700;
      color: #5a9ecf;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity .4s, transform .4s, border-color .4s, color .4s;
      box-shadow: 0 2px 12px rgba(77,171,247,.12);
    }
    #flee-badge.show { opacity: 1; transform: translateY(0); }
    #flee-count {
      font-family: 'Dancing Script', cursive;
      font-size: 1.2rem;
      color: #2d7fc1;
      min-width: 26px;
      text-align: center;
      transition: transform .2s;
    }

    /* progress ring inside badge */
    #flee-ring { display: block; margin-right: 2px; }

    /* ---- taunt message ---- */
    #taunt {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border: 1.5px solid #b8ecdb;
      border-radius: 50px;
      padding: 12px 28px;
      font-size: .88rem;
      font-weight: 600;
      color: #3d9e79;
      white-space: nowrap;
      opacity: 0;
      z-index: 60;
      pointer-events: none;
      transition: opacity .5s, transform .5s;
      box-shadow: 0 4px 20px rgba(56,217,169,.15);
    }
    #taunt.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- overlay ---- */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(240,248,255,0);
      backdrop-filter: blur(0px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s, backdrop-filter .5s;
    }
    #overlay.active {
      opacity: 1;
      pointer-events: all;
      background: rgba(228,242,255,0.84);
      backdrop-filter: blur(14px);
    }
    .celebrate-box {
      background: rgba(255,255,255,0.9);
      
      padding: 50px 46px 42px;
      max-width: 420px;
      width: 88vw;
      text-align: center;
      box-shadow: 0 8px 60px rgba(77,171,247,.2);
      border: 1.5px solid rgba(255,255,255,.92);
      transform: scale(.68);
      transition: transform .55s cubic-bezier(.22,1,.36,1) .1s;
    }
    #overlay.active .celebrate-box { transform: scale(1); }
    .celebrate-emoji-row {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 12px;
      animation: popIn .55s .2s both;
      letter-spacing: 6px;
    }
    @keyframes popIn {
      from { transform: scale(0) rotate(-15deg); }
      60%  { transform: scale(1.18) rotate(4deg); }
      to   { transform: scale(1) rotate(0); }
    }
    .celebrate-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #2d7fc1;
      margin-bottom: 10px;
    }
    .celebrate-sub {
      font-size: .96rem;
      color: #5a8aaa;
      font-weight: 500;
      line-height: 1.7;
    }
    .redirect-bar {
      margin-top: 22px;
      height: 5px;
      background: #e4f0fb;
      border-radius: 99px;
      overflow: hidden;
    }
    .redirect-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4dabf7, #38d9a9);
      border-radius: 99px;
      transition: width 2s linear;
    }
    .redirect-label { font-size: .74rem; color: #8fbcd4; margin-top: 8px; }

    /* ---- confetti & hearts ---- */
    .confetti-piece {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-10px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(100vh) rotate(680deg); opacity: 0; }
    }
    .heart-fly {
      position: fixed;
      pointer-events: none;
      z-index: 200;
      animation: heartFly ease-out forwards;
    }
    @keyframes heartFly {
      0%   { transform: translate(0,0) scale(1);                    opacity: 1; }
      100% { transform: translate(var(--hx),var(--hy)) scale(.25);  opacity: 0; }
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; }
      .btn  { padding: 13px 24px; font-size: .92rem; }
      .celebrate-title { font-size: 2rem; }
      #taunt { font-size: .78rem; padding: 10px 20px; white-space: normal; text-align: center; max-width: 85vw; border-radius: 18px; }
    }
  </style>
</head>
<body>

<script>
/* ==============================================================
   KONFIGURASI — GANTI DI SINI
============================================================== */
const WA_NUMBER  = "6283866149421";          // nomor WA tanpa +
const WA_MESSAGE = "Hai, aku mau kok jadi pacar kamu \u2764\uFE0F Makasih ya udah nembak aku, ini jawaban aku~";

const FLEE_MAX = 50;

/* ==============================================================
   FLOATING ROMANTIC EMOJIS
   Semua pakai Unicode escape / HTML entity agar render di
   GitHub Pages tanpa masalah encoding file
============================================================== */
(function spawnFloatingEmojis() {
  // [ char, max-opacity, size-rem ]
  const items = [
    ['\u2764\uFE0F', .28, 1.5],   // ❤️
    ['\uD83D\uDC99', .25, 1.3],   // 💙
    ['\uD83D\uDC9A', .23, 1.2],   // 💚
    ['\uD83E\uDEB7', .22, 1.2],   // 🪷
    ['\u2728',       .30, 1.6],   // ✨
    ['\uD83C\uDF38', .22, 1.3],   // 🌸
    ['\uD83C\uDF39', .22, 1.3],   // 🌹
    ['\uD83D\uDC8C', .26, 1.2],   // 💌
    ['\uD83E\uDD8B', .20, 1.4],   // 🦋
    ['\uD83C\uDF3A', .22, 1.2],   // 🌺
    ['\uD83D\uDCAB', .28, 1.6],   // 💫
    ['\u2B50',       .24, 1.3],   // ⭐
    ['\uD83C\uDF37', .22, 1.2],   // 🌷
    ['\uD83D\uDC93', .18, 1.0],   // 💓
  ];

  for (let i = 0; i < 32; i++) {
    const [ch, op, size] = items[i % items.length];
    const el   = document.createElement('div');
    el.className = 'float-emoji';
    el.textContent = ch;
    const dur    = (Math.random() * 14 + 10).toFixed(1);
    const delay  = (Math.random() * 16).toFixed(1);
    const rot    = ((Math.random() * 2 - 1) * 270).toFixed(0) + 'deg';
    const left   = (Math.random() * 96 + 2).toFixed(1);
    const bottom = -(Math.random() * 30 + 5);
    el.style.cssText = [
      `left:${left}%`,
      `bottom:${bottom}px`,
      `font-size:${size}rem`,
      `--op:${op}`,
      `--rot:${rot}`,
      `animation-duration:${dur}s`,
      `animation-delay:-${delay}s`,
    ].join(';');
    document.body.appendChild(el);
  }
})();

/* ==============================================================
   FLOATING BUBBLES
============================================================== */
(function spawnBubbles() {
  const cont   = document.getElementById('bubbles');
  const colors = ['#c3dffe','#b8f0e3','#d4c9ff','#fde9c0','#cfeeff'];
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const s = Math.random() * 55 + 16;
    b.style.cssText = [
      `width:${s}px`, `height:${s}px`,
      `left:${(Math.random()*100).toFixed(1)}%`,
      `background:${colors[i % colors.length]}`,
      `animation-duration:${(Math.random()*12+9).toFixed(1)}s`,
      `animation-delay:-${(Math.random()*14).toFixed(1)}s`,
    ].join(';');
    cont.appendChild(b);
  }
})();

/* ==============================================================
   TYPEWRITER
============================================================== */
const LINES = [
  { id:'tw1', curId:'cur1', lineId:'line1', text:'Aku suka kamu\u2026',                              delayMs: 800  },
  { id:'tw2', curId:'cur2', lineId:'line2', text:'Serius banget, udah lama aku pendam perasaan ini.', delayMs: 1400 },
  { id:'tw3', curId:'cur3', lineId:'line3', text:'Maukah kamu jadi pacarku? \uD83C\uDF37',            delayMs: 2800 },
];

function typeText(spanId, curId, lineId, text, startDelay, speed) {
  speed = speed || 52;
  return new Promise(function(resolve) {
    setTimeout(function() {
      var span  = document.getElementById(spanId);
      var cur   = document.getElementById(curId);
      var line  = document.getElementById(lineId);
      cur.style.display = 'inline-block';
      line.classList.add('visible');
      var chars = Array.from(text);
      var i = 0;
      var iv = setInterval(function() {
        span.textContent += chars[i++];
        if (i >= chars.length) {
          clearInterval(iv);
          setTimeout(function() { cur.style.display = 'none'; resolve(); }, 400);
        }
      }, speed);
    }, startDelay);
  });
}

setTimeout(function() { document.getElementById('line0').classList.add('visible'); }, 300);

(async function() {
  for (var i = 0; i < LINES.length; i++) {
    var l = LINES[i];
    await typeText(l.id, l.curId, l.lineId, l.text, l.delayMs);
  }
  document.getElementById('divider').classList.add('show');
  setTimeout(function() { document.getElementById('btnArea').classList.add('show'); }, 350);
})();

/* ==============================================================
   TOMBOL KABUR
============================================================== */
var btnNo  = document.getElementById('btnNo');
var tx = 0, ty = 0; // current translate offset
var busy = false;

btnNo.style.position = 'relative';
btnNo.style.zIndex   = '50';

function fleeButton(e) {
  e.preventDefault();
  if (busy) return;
  busy = true;

  var vw   = window.innerWidth;
  var vh   = window.innerHeight;
  var rect = btnNo.getBoundingClientRect();

  // Try up to 20 times to find a spot that keeps btn fully inside viewport
  var nx = tx, ny = ty, attempts = 0;
  do {
    var dx = (Math.random() - 0.5) * (vw * 0.7);
    var dy = (Math.random() - 0.5) * (vh * 0.7);
    nx = tx + dx;
    ny = ty + dy;
    // projected screen position
    var px = rect.left - tx + nx;
    var py = rect.top  - ty + ny;
    attempts++;
  } while (attempts < 20 && (px < 8 || py < 8 || px + rect.width > vw - 8 || py + rect.height > vh - 8));

  tx = nx; ty = ny;
  btnNo.style.transition = 'transform 280ms cubic-bezier(.22,1,.36,1)';
  btnNo.style.transform  = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px)';

  setTimeout(function() { busy = false; }, 320);
}

btnNo.addEventListener('click',      fleeButton);
btnNo.addEventListener('touchstart', fleeButton, { passive: false });

/* ==============================================================
   TOMBOL IYA
============================================================== */
function handleYes() {
  spawnConfetti();
  spawnHearts();
  var overlay = document.getElementById('overlay');
  overlay.classList.add('active');
  setTimeout(function() { document.getElementById('redirectFill').style.width = '100%'; }, 60);
  setTimeout(function() {
    document.getElementById('redirectLabel').textContent = 'Membuka WhatsApp\u2728';
    var url = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(WA_MESSAGE);
    window.open(url, '_blank');
  }, 2300);
}

/* ==============================================================
   CONFETTI
============================================================== */
function spawnConfetti() {
  var colors = ['#74c0fc','#63e6be','#a9e34b','#ffd43b','#748ffc','#da77f2','#ff8787','#38d9a9','#4dabf7'];
  for (var i = 0; i < 110; i++) {
    (function() {
      var c = document.createElement('div');
      c.className = 'confetti-piece';
      var circle = Math.random() > .45;
      c.style.cssText = [
        'left:' + (Math.random()*100).toFixed(1) + 'vw',
        'top:-14px',
        'background:' + colors[Math.floor(Math.random()*colors.length)],
        'border-radius:' + (circle ? '50%' : '2px'),
        'width:'  + (Math.random()*9+4).toFixed(1) + 'px',
        'height:' + (Math.random()*9+4).toFixed(1) + 'px',
        'animation-duration:' + (Math.random()*1.8+1).toFixed(2) + 's',
        'animation-delay:'    + (Math.random()*0.9).toFixed(2) + 's',
      ].join(';');
      document.body.appendChild(c);
      c.addEventListener('animationend', function() { c.remove(); });
    })();
  }
}

/* ==============================================================
   FLOATING HEARTS (on yes)
============================================================== */
function spawnHearts() {
  var emojis = [
    '\u2764\uFE0F','\uD83D\uDC99','\uD83D\uDC9A',
    '\uD83E\uDEB7','\u2728','\uD83C\uDF38',
    '\uD83D\uDCAB','\uD83E\uDD8B','\u2B50'
  ];
  for (var i = 0; i < 32; i++) {
    (function(idx) {
      setTimeout(function() {
        var h = document.createElement('div');
        h.className = 'heart-fly';
        h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        var sx = Math.random() * window.innerWidth;
        var sy = Math.random() * window.innerHeight;
        var hx = ((Math.random()-.5)*340).toFixed(0);
        var hy = (-(Math.random()*340+80)).toFixed(0);
        h.style.cssText = [
          'left:' + sx + 'px',
          'top:'  + sy + 'px',
          '--hx:' + hx + 'px',
          '--hy:' + hy + 'px',
          'animation-duration:' + (Math.random()*1.1+0.9).toFixed(2) + 's',
          'font-size:' + (Math.random()*1.3+1).toFixed(2) + 'rem',
        ].join(';');
        document.body.appendChild(h);
        h.addEventListener('animationend', function() { h.remove(); });
      }, idx * 65);
    })(i);
  }
}
</script>
</body>
</html>
